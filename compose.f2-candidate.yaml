# U02 F.2 single-file candidate only; NOT a deployment authorization.
# F.2 policy acceptance, registry mapping, host consent and runtime remain unverified.
# Do not use this file to run a worker without approved agent and mandate IDs.
services:
  uaes-worker:
    build: .
    restart: unless-stopped
    environment:
      UAES_DB: /data/uaes.sqlite
      UAES_AGENT_ID: ${UAES_AGENT_ID:?existing agent identity required}
      UAES_MANDATE_ID: ${UAES_MANDATE_ID:?approved mandate required}
    volumes:
      - uaes_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cpus: "0.35"
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  uaes_data:

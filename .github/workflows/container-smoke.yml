name: UAES Container Smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated image
        run: docker build --tag uaes-smoke:${{ github.sha }} .
      - name: Seed synthetic task
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/uaes-smoke"
          python scripts/container_smoke.py seed "${{ runner.temp }}/uaes-smoke/uaes.sqlite"
          chmod 777 "${{ runner.temp }}/uaes-smoke"
          chmod 666 "${{ runner.temp }}/uaes-smoke/uaes.sqlite"
      - name: Start bounded worker with persistent volume
        shell: bash
        run: |
          AGENT=$(python -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/uaes-smoke/uaes.sqlite.ids"))["agent"])')
          MANDATE=$(python -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/uaes-smoke/uaes.sqlite.ids"))["mandate"])')
          docker run --rm --network none -v "${{ runner.temp }}/uaes-smoke:/data" uaes-smoke:${{ github.sha }} python -m src.daemon --db /data/uaes.sqlite --agent "$AGENT" --mandate "$MANDATE" --interval 0 --max-iterations 1
      - name: Verify task persisted and no double completion
        shell: bash
        run: |
          python scripts/container_smoke.py verify "${{ runner.temp }}/uaes-smoke/uaes.sqlite"
          AGENT=$(python -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/uaes-smoke/uaes.sqlite.ids"))["agent"])')
          MANDATE=$(python -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/uaes-smoke/uaes.sqlite.ids"))["mandate"])')
          docker run --rm --network none -v "${{ runner.temp }}/uaes-smoke:/data" uaes-smoke:${{ github.sha }} python -m src.daemon --db /data/uaes.sqlite --agent "$AGENT" --mandate "$MANDATE" --interval 0 --max-iterations 1
          python scripts/container_smoke.py verify "${{ runner.temp }}/uaes-smoke/uaes.sqlite"

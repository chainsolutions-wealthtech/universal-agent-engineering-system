name: UAES Continuity Dispatch
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  issues:
    types: [opened, edited, closed, reopened]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Documentation validation"]
    types: [completed]
permissions:
  contents: read
  checks: read
  issues: read
  pull-requests: read
concurrency:
  group: uaes-continuity
  cancel-in-progress: false
jobs:
  determine-next:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Observe GitHub and compute evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo=os.environ["GH_REPO"]
          def gh(*args):
            p=subprocess.run(["gh","api",*args],text=True,capture_output=True)
            if p.returncode:
              return None
            try:return json.loads(p.stdout)
            except json.JSONDecodeError:return None
          pr=gh(f"repos/{repo}/pulls/1") or {}
          head=pr.get("head",{}).get("sha","")
          branch=gh(f"repos/{repo}/branches/main") or {}
          protection=gh(f"repos/{repo}/branches/main/protection")
          rulesets=gh(f"repos/{repo}/rulesets")
          checks=gh(f"repos/{repo}/commits/{head}/check-runs") if head else None
          runs=(checks or {}).get("check_runs",[])
          def check_green(job_name):
            items=[x for x in runs if x.get("name")==job_name
              and x.get("head_sha")==head and x.get("app",{}).get("slug")=="github-actions"
              and isinstance(x.get("id"),int)]
            if not items:return False
            latest=max(items,key=lambda x:x["id"])
            return latest.get("status")=="completed" and latest.get("conclusion")=="success"
          required=("core-tests","documentary-contracts","container-smoke","automated-review")
          # Fail closed on unknown rulesets or branch protection; a GitHub-enforced
          # approval requirement is never ignored to satisfy owner automation policy.
          review_policy_verified=(isinstance(protection,dict)
            and protection.get("required_pull_request_reviews") is None
            and isinstance(rulesets,list) and not rulesets)
          ev={"main_protected":branch.get("protected") is True,
              "review_policy_automated":review_policy_verified,
              "automated_review_passed":check_green("automated-review"),
              "ci_success_current_head":all(check_green(name) for name in required),
              "permissions_attested":False,"runtime_verified":False}
          Path("evidence.json").write_text(json.dumps(ev))
          PY
      - name: Select next action (read-only)
        run: UAES_EVIDENCE_FILE=evidence.json python scripts/continuity_engine.py | tee continuity-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: uaes-continuity-${{ github.run_id }}
          path: |
            continuity-receipt.json
            evidence.json
          retention-days: 30
